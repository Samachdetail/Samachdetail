
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samach Detail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
        }
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header img {
            max-width: 120px;
            display: block;
            margin: 10px auto;
        }
        .content {
            padding: 20px;
        }
        .services {
            margin: 20px 0;
        }
        .services h2 {
            margin-bottom: 10px;
        }
        .services ul {
            padding-left: 20px;
        }
        .whatsapp-button {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        .whatsapp-button a button {
            background-color: #25D366;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
        }
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo de Samach Detail">
    <h1>Samach Detail</h1>
    <p>Especialistas en estética automotriz</p>
</header>

<div class="content">
    <section class="services">
        <h2>Servicios que ofrecemos</h2>
        <ul>
            <li>Car Wash</li>
            <li>Pulidos</li>
            <li>Lavado de motor</li>
            <li>Desmanchado de vidrios</li>
            <li>Servicio de preventa</li>
            <li>Detailing interior</li>
        </ul>
    </section>

    <div class="whatsapp-button">
        <a href="https://wa.me/56926175151?text=Hola%20quisiera%20conocer%20las%20horas%20disponibles%20y%20agendar%20una%20cita" target="_blank">
            <button>Reservar por WhatsApp</button>
        </a>
    </div>

    <section class="gallery">
        <img src="imagen1.jpg" alt="Ejemplo 1">
        <img src="imagen2.jpg" alt="Ejemplo 2">
        <img src="imagen3.jpg" alt="Ejemplo 3">
    </section>
</div>

<footer>
    &copy; 2025 Samach Detail. Todos los derechos reservados.
</footer>

</body>
</html>
